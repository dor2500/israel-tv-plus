# Programme guide: tools/make_epg.py every two hours -> epg.json on the "epg" branch (one commit, force-pushed).
# The apps read it from raw.githubusercontent.com/dor2500/israel-tv-plus/epg/epg.json.
name: EPG
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epg
  cancel-in-progress: true
jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/make_epg.py epg.json "$RUNNER_TEMP/epg-cache"
      - name: Publish to the epg branch
        run: |
          mkdir out && mv epg.json out/
          cd out
          git init -q -b epg
          git add epg.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "EPG $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" epg
