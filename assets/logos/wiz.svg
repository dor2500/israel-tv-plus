<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <linearGradient id="wizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#wizBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#wizGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Central Glow / Emblem -->
  <circle cx="256" cy="220" r="160" fill="url(#wizGrad)" opacity="0.12" filter="url(#glow)"/>
  
  <!-- WIZ Lettering -->
  <g filter="url(#glow)">
    <text x="256" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="168" font-weight="900" fill="url(#wizGrad)" text-anchor="middle" letter-spacing="-2">WIZ</text>
  </g>
  
  <!-- Subtitle -->
  <rect x="136" y="325" width="240" height="42" rx="21" fill="#00C9FF" opacity="0.18" />
  <text x="256" y="354" font-family="'Heebo', 'Rubik', sans-serif" font-size="24" font-weight="800" fill="#E0F2FE" text-anchor="middle" letter-spacing="2">ערוץ הילדים החכם</text>
  
  <!-- Top brand pill -->
  <rect x="206" y="60" width="100" height="30" rx="15" fill="#38BDF8" opacity="0.25" />
  <text x="256" y="81" font-family="'Heebo', 'Rubik', sans-serif" font-size="18" font-weight="900" fill="#38BDF8" text-anchor="middle">yes WIZ</text>
</svg>
