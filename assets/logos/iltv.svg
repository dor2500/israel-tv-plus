<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iltvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="iltvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#iltvBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#60A5FA" stroke-width="6" opacity="0.4" />
  
  <!-- ILTV Emblem -->
  <text x="256" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ILTV</text>
  
  <!-- Subtitle -->
  <rect x="146" y="325" width="220" height="42" rx="21" fill="#2563EB" opacity="0.3" />
  <text x="256" y="354" font-family="'Heebo', 'Rubik', sans-serif" font-size="22" font-weight="800" fill="#DBEAFE" text-anchor="middle" letter-spacing="1">ISRAEL NEWS</text>
  
  <!-- Star of David accent -->
  <polygon points="256,70 263,85 279,85 266,95 271,110 256,101 241,110 246,95 233,85 249,85" fill="#60A5FA" opacity="0.8"/>
</svg>
