<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="buzzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="buzzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180018" />
      <stop offset="100%" stop-color="#2D0B3A" />
    </linearGradient>
    <filter id="buzzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#buzzBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#buzzGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Central Badge -->
  <circle cx="256" cy="225" r="150" fill="url(#buzzGrad)" opacity="0.15" filter="url(#buzzGlow)"/>
  
  <!-- BUZZ Text -->
  <g filter="url(#buzzGlow)">
    <text x="256" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="125" font-weight="900" fill="url(#buzzGrad)" text-anchor="middle" letter-spacing="3">BUZZ</text>
  </g>
  
  <!-- Subtitle -->
  <rect x="146" y="325" width="220" height="42" rx="21" fill="#FF007F" opacity="0.2" />
  <text x="256" y="354" font-family="'Heebo', 'Rubik', sans-serif" font-size="24" font-weight="800" fill="#FCE7F3" text-anchor="middle" letter-spacing="2">ערוץ הצעירים</text>
  
  <!-- Top brand pill -->
  <rect x="206" y="60" width="100" height="30" rx="15" fill="#E11D48" opacity="0.3" />
  <text x="256" y="81" font-family="'Heebo', 'Rubik', sans-serif" font-size="18" font-weight="900" fill="#FF4081" text-anchor="middle">HOT באזז</text>
</svg>
