<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kidsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#FFD93D" />
      <stop offset="100%" stop-color="#4D96FF" />
    </linearGradient>
    <linearGradient id="kidsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#kidsBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#kidsGrad)" stroke-width="6" opacity="0.5" />
  
  <!-- yes brand -->
  <text x="256" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="-1">yes</text>
  
  <!-- Popcorn / Star Emblem -->
  <circle cx="256" cy="245" r="95" fill="url(#kidsGrad)" opacity="0.18" filter="url(#glow)"/>
  <text x="256" y="278" font-family="'Heebo', 'Rubik', sans-serif" font-size="105" font-weight="900" fill="#FFD93D" text-anchor="middle" filter="url(#glow)">ילדים</text>
  
  <!-- Subtitle -->
  <rect x="136" y="340" width="240" height="46" rx="23" fill="#FF6B6B" opacity="0.25" />
  <text x="256" y="372" font-family="'Heebo', 'Rubik', sans-serif" font-size="26" font-weight="800" fill="#F8FAFC" text-anchor="middle">yes קולנוע ילדים</text>
</svg>
